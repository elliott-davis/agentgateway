apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: virtual-models
  namespace: default
spec:
  gatewayClassName: agentgateway
  listeners:
  - name: llm
    port: 80
    protocol: HTTP
    allowedRoutes:
      kinds:
      - group: agentgateway.dev
        kind: AgentgatewayModel
      namespaces:
        from: Same
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: claude-3-7-sonnet
  namespace: default
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: virtual-models
    sectionName: llm
  visibility: Internal
  provider: Anthropic
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: claude-3-5-sonnet
  namespace: default
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: virtual-models
    sectionName: llm
  visibility: Internal
  provider: Anthropic
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: coding-agent
  namespace: default
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: virtual-models
    sectionName: llm
  virtualModel:
    switchyard:
      targets:
      - modelRef:
          name: claude-3-7-sonnet
        tier: Capable
        contextWindow: 200000
      - modelRef:
          name: claude-3-5-sonnet
        tier: Efficient
      - modelRef:
          name: missing-model
        tier: Efficient
      sessionAffinity:
        header: x-agent-session-id
        idleTimeout: 30m
        maxSessions: 5000
      fallbackBehavior: RejectIfOutOfClass
      stageRouter:
        mode: EfficientFirst
        confidenceThresholdPercent: 75
        capableHoldTurns: 2

